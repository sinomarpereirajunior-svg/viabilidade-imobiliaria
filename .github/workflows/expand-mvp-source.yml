name: Expand Viabilidade Imobiliaria MVP
on:
  push:
    branches:
      - mvp-next
    paths:
      - application.tar.gz.b64

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: mvp-next
          persist-credentials: true

      - name: Expand application source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/viabilidade-source
          tar -xzf application.tar.gz.b64 -C /tmp/viabilidade-source
          test -d /tmp/viabilidade-source/viabilidade-imobiliaria-app
          cp -a /tmp/viabilidade-source/viabilidade-imobiliaria-app/. .
          rm -f application.tar.gz.b64
          # Remove the old static-only override so Vercel can detect Next.js.
          rm -f vercel.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: expand Next.js feasibility MVP source"
          git push origin HEAD:mvp-next
